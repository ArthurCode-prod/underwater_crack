[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "underwater-crack"
version = "0.1.0"
description = "Synthetic underwater degradation and crack segmentation with PatentUNet-TAFE"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.7",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
